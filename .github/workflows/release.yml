name: Prepare Toolbox release draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python toolbox/build_headers.py
      - run: python toolbox/build.py
      - run: python toolbox/tests/test_modular.py
      - run: python toolbox/tests/test_toolbox.py
      - run: python toolbox/tests/test_workflow.py
      - run: python toolbox/build.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: c-toolbox-release-candidate
          path: toolbox/dist/c_toolbox_v*.py
          if-no-files-found: error
  draft:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c-toolbox-release-candidate
          path: assets
      - name: Create versioned draft without replacing published files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("toolbox/catalog.json", encoding="utf-8"))["version"])')"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; use a new version."
            exit 1
          fi
          gh release create "v$version" "assets/c_toolbox_v$version.py" --draft --prerelease --target "$GITHUB_SHA" --title "C Toolbox v$version" --notes-file toolbox/RELEASE_NOTES.md
